# historica's tasks too big to be a command: four CI jobs, and the searches and
# timings that are not CI. Not a published crate — `publish = false` keeps it
# out of any `cargo publish` sweep, and it deliberately has no dependencies:
# those jobs build it before they can do anything, so the cost of building it
# is paid on every push and in every developer's first run.
[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
