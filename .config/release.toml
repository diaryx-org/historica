# What the shared release tooling needs to know about historica. Everything not
# stated here is a default in lib/repo.nu — the manifest, the changelog path,
# the cliff config, and that this is a Cargo workspace.
name = "historica"
url = "https://github.com/diaryx-org/historica"
release_branch = "main"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"
# …and here, after the bump rather than before it. `historica_requirement_tracks_
# the_workspace` in xtask compares `[workspace.package] version` against the
# `historica` requirement in `cli/Cargo.toml`, so running it first judges the
# versions this release is replacing — which is how a bump that moved the first
# and not the second got as far as `cargo update` refusing to resolve. After the
# bump, that test is a real guard, and a failure restores the tree.
verify_after_bump = true

# No `tag_starts`: nothing runs on the tag. The GitHub release is cut by `release`
# itself, from the machine that pushed the tag — `release github-release <tag>` is
# the same step run on its own — and every upload to crates.io is a
# `cargo publish --workspace` somebody runs deliberately. So the warning before
# the push says exactly that, rather than naming a workflow that no longer exists.
