# git-cliff configuration for historica.
#
# One consumer, and it is a program rather than a person: `cargo xtask changelog`
# regenerates the marked region inside `docs/CHANGELOG.md`'s `## Unreleased`
# section, and `cargo xtask release` renders that same region one last time —
# under the version being cut — before moving it down into a released section.
# Nothing else reads this file, so the template below is written for a changelog
# bullet and nothing else.
#
# The **Behavioural changes** section is generated too, from `Behavioural-change:`
# trailers rather than from subjects. The rule that section answers — "would a
# caller who upgrades without editing a line of their own code observe a
# difference" — is a judgment about the change, and no subject can carry it: a
# `fix:` can be behavioural and an `add:` can be silently behavioural. But the
# judgment is not unrecoverable, only unrecoverable from the SUBJECT. Asking the
# author to write it as a trailer keeps it where it has to be made — at the
# commit, by the person holding the context — while ending the duplication that
# came of writing it a second time by hand, where it could drift from the change
# or be forgotten entirely.
#
# One trailer per observable difference; a commit may carry several. Write the
# value as prose a consumer can act on: what used to happen, what happens now.
# Continuation lines are indented two spaces and fold into one paragraph.
#
#     Behavioural-change: A payload is filed under a name the store owns.
#       It used to keep the source file's extension, which a file browser
#       would then write metadata beside.
#
# Still handwritten, and deliberately: a release INTRO, for a release that needs
# a narrative rather than a list. It goes in the released section under the
# heading `cargo xtask release` writes, below the end marker, where regeneration
# cannot reach it.

[changelog]
header = ""
footer = ""
trim = true

# One `### Group` per bucket, commits as bullets. Scope is surfaced because
# historica's subjects lean on it (`add(store)`, `fix(naming)`) to say which
# surface moved. The short hash makes a bullet traceable back to the diff during
# triage.
#
# Then one **Behavioural changes** section for the whole release, collected from
# every `Behavioural-change:` trailer in commit order. It comes last because it
# is what a consumer upgrading reads first-and-only: the groups above say what
# moved, this says what will break under them. Gathered into a list before
# rendering so the heading appears only when there is something under it — a
# release with no observable difference should not advertise an empty section.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}** — {% endif %}{{ commit.message }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/diaryx-org/historica/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{%- set_global notes = [] -%}
{%- for commit in commits -%}
{#- `default`, because a commit whose subject git-conventional cannot parse
    (a wrapped one, say) carries no `footers` key at all rather than an empty
    one, and an unguarded access aborts the whole render. -#}
{%- for f in commit.footers | default(value=[]) -%}
{%- if f.token == "Behavioural-change" -%}
{%- set_global notes = notes | concat(with=f.value) -%}
{%- endif -%}
{%- endfor -%}
{%- endfor -%}
{% if notes | length > 0 %}
### Behavioural changes
{% for n in notes %}
- {{ n | trim }}
{% endfor %}
{%- endif %}"""

[git]
conventional_commits = true
# historica's history predates the org convention: every commit through
# `6ce4ab9` is a bare declarative sentence — `Decide what forgetting means under
# sync` — with no type and no scope, and those stay as they are. Keeping
# unconventional commits in (rather than dropping them) is what lets the
# catch-all parser below surface them for triage instead of silently losing
# them, which matters here more than anywhere: the repository has never been
# tagged, so its first release section covers that whole pre-convention stretch.
filter_unconventional = false
filter_commits = false
protect_breaking_commits = true
split_commits = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

commit_preprocessors = [
  # The house convention is sometimes spelled with the colon dropped —
  # `add(store) the store explains itself`. git-conventional reads that as
  # unparseable, and an unparseable subject costs more than a bucket: git-cliff
  # then has no idea where the subject ends, so the ENTIRE commit body lands in
  # the bullet, and the `Behavioural-change:` trailers below it are never seen
  # as trailers at all. Putting the colon back before parsing rescues those
  # commits rather than only what is committed from here on. The type list is
  # closed on purpose: a subject starting with any other word is off-convention
  # and should reach the triage bucket, not be silently promoted into `Added`.
  { pattern = '^(?P<type>add|feat|fix|docs|chore|refactor|perf|polish|test|ci|build|style)(?P<scope>\([^)\n]*\))?(?P<bang>!)?[ \t]+(?P<rest>[^\s:])', replace = "${type}${scope}${bang}: ${rest}" },
  # Trailing period on a SUBJECT reads wrong once it is a bullet. Anchored to
  # the first line, because a preprocessor sees the whole message: an
  # end-of-STRING anchor would leave the subject alone on any multi-line commit
  # and quietly eat the last period of the body — which, now that
  # `Behavioural-change:` trailers live down there, would truncate the last
  # sentence a consumer reads.
  { pattern = '^(?P<subject>[^\n]*?)[ \t]*\.[ \t]*(?P<rest>\n|$)', replace = "${subject}${rest}" },
  # The pre-convention stretch, triaged. Every subject through `6ce4ab9` is
  # mapped below onto the type and scope it would have carried had the
  # convention existed, so those commits group with everything written after
  # them instead of sitting in a bucket the first release would have to ship.
  # The rule below this block is what catches anything they miss. The mapping is
  # by subject text rather than by hash, because a preprocessor only ever sees
  # the message; that is safe here and nowhere else, since these are the one
  # part of this history that will never be rewritten.
  #
  # Two judgments are baked in. A commit that only revised a decision document
  # is `docs`, and drops out — including `e73d4f9`, which also moved a constant
  # in `core`, because "a change ID is now 96 bits" is not a difference anyone
  # can observe against a release that does not exist. And `Initial commit` is
  # given a subject it never had, since the one it has says nothing and a first
  # release's **Added** list is the only place a reader meets the core module.
  #
  # These rules have to precede the `legacy:` rule below, which tests for a
  # leading capital: they rewrite the subject to start with a lowercase type,
  # which is exactly how a triaged commit stops looking pre-convention.
  { pattern = '^Initial commit', replace = "add(core): a causal history that merges by union" },
  { pattern = '^Give every revision two identities', replace = "add(core): give every revision two identities" },
  { pattern = '^Read and write the revision document', replace = "add(format): read and write the revision document" },
  { pattern = '^Read and write the operation document', replace = "add(format): read and write the operation document" },
  { pattern = '^Read and write the store', replace = "add(store): read and write the store" },
  { pattern = '^Hold a store to the files it says it holds', replace = "add(store): hold a store to the files it says it holds" },
  { pattern = '^Materialise a history that has a merge in it', replace = "add(store): materialise a history that has a merge in it" },
  { pattern = '^Replay a linear history into the file it produced', replace = "add(replay): replay a linear history into the file it produced" },
  { pattern = '^Record operations from an edited file', replace = "add(diff): record operations from an edited file" },
  { pattern = '^Read a tree, and replay one', replace = "add(tree): read a tree, and replay one" },
  { pattern = '^Merge concurrent branches by walking their event graph', replace = "add(merge): merge concurrent branches by walking their event graph" },
  { pattern = '^Read a store from the command line', replace = "add(cli): read a store from the command line" },
  { pattern = '^Show how the folder differs from what is recorded', replace = "add(cli): show how the folder differs from what is recorded" },
  { pattern = '^Record a revision from the folder beside the store', replace = "add(record): record a revision from the folder beside the store" },
  { pattern = '^Merge two lines of work, and record the resolution', replace = "add(conflict): merge two lines of work, and record the resolution" },
  { pattern = '^File a history where a person can find it, and say what it skips', replace = "add(arrange): file a history where a person can find it, and say what it skips" },
  { pattern = '^Keep the error a caller returns small', replace = "refactor(store): keep the error a caller returns small" },
  { pattern = '^Propose the readable revision document', replace = "docs(decisions): propose the readable revision document" },
  { pattern = '^Free revision identity from the filename', replace = "docs(decisions): free revision identity from the filename" },
  { pattern = '^Answer the questions the format left open', replace = "docs(decisions): answer the questions the format left open" },
  { pattern = '^Spell the version as a preamble and shorten the change ID', replace = "docs(decisions): spell the version as a preamble and shorten the change ID" },
  { pattern = '^Reconcile the earlier decisions with content and merge', replace = "docs(decisions): reconcile the earlier decisions with content and merge" },
  { pattern = '^Require the blank line in an operation document', replace = "docs(decisions): require the blank line in an operation document" },
  { pattern = '^Decide how operations are recorded from an edited file', replace = "docs(decisions): decide how operations are recorded from an edited file" },
  { pattern = '^Decide the tree: files, paths, existence, and rename', replace = "docs(decisions): decide the tree — files, paths, existence, and rename" },
  { pattern = '^Decide where a change ID, an author, and a time come from', replace = "docs(decisions): decide where a change ID, an author, and a time come from" },
  { pattern = "^Close the writer's open questions", replace = "docs(decisions): close the writer's open questions" },
  { pattern = '^Decide what a writer is given', replace = "docs(decisions): decide what a writer is given" },
  { pattern = '^Decide how a conflict is shown and how a resolution is recorded', replace = "docs(decisions): decide how a conflict is shown and how a resolution is recorded" },
  { pattern = '^Decide how work is thrown away and how a store is pruned', replace = "docs(decisions): decide how work is thrown away and how a store is pruned" },
  { pattern = '^Decide what forgetting means under sync', replace = "docs(decisions): decide what forgetting means under sync" },
  { pattern = '^Decide what status shows and what it is allowed to know', replace = "docs(decisions): decide what status shows and what it is allowed to know" },
  { pattern = '^Decide how a store reads to the person browsing it', replace = "docs(decisions): decide how a store reads to the person browsing it" },
  { pattern = '^Update \.gitignore', replace = "chore: update .gitignore" },
  # The pre-convention stretch: every commit through `6ce4ab9` is a bare
  # declarative sentence with no type — `Decide what forgetting means under
  # sync` — and git-conventional cannot parse one. Left alone, that costs far
  # more than a bucket: with no type to end the subject on, git-cliff treats the
  # ENTIRE message as the subject, so each of those thirty-five commits renders
  # as its whole multi-paragraph body inside a single bullet, and the
  # `Behavioural-change:` trailers at the bottom are never seen as trailers.
  #
  # So give them a type they do not have. `legacy` parses, which is the whole
  # point: the subject ends at the first line, the body stops being the bullet,
  # and the trailers are read. The parser below routes `legacy` to the triage
  # bucket, so nothing is hidden — it is exactly the same commits, legible.
  #
  # The test for "pre-convention" is the leading capital. It is not a
  # coincidence: a conventional subject begins with its lowercase type, and
  # every commit in that stretch begins with a capitalised verb. A new commit
  # written off-convention starting lowercase still reaches triage by the
  # catch-all parser; one starting with a capital reaches it through here.
  # Five later commits that are off-convention a different way: they carry a
  # scope and a subject and no type at all — `fs: replace mutable files
  # atomically` — so git-conventional reads `fs` as the type, finds no rule for
  # it, and drops them into the triage bucket. They are triaged the same way
  # the pre-convention stretch is, by naming the type each would have carried,
  # because the alternative is a released section with an "Uncategorised —
  # triage before release" heading in it, which is a note to the author printed
  # for the reader.
  { pattern = '^fs: replace mutable files atomically', replace = "fix(fs): replace mutable files atomically" },
  { pattern = '^record: require acceptance for contested attachments', replace = "add(record): require acceptance for contested attachments" },
  { pattern = '^Add content-aware local store receive', replace = "add(store): receive another store, by content rather than by filename" },
  { pattern = '^store: load resolution documents beside operation documents', replace = "add(store): load resolution documents beside operation documents" },
  { pattern = '^merge: cross a resolution in the event-graph walk', replace = "add(merge): cross a resolution in the event-graph walk" },
  { pattern = '^(?P<subject>[A-Z][^\n]*)', replace = "legacy: ${subject}" },
  # A bare `<rev>` is HTML once the bullet is rendered, and the word disappears.
  # Backtick anything angle-bracketed that isn't already — where "already" has
  # to mean the whole line, not the character in front. prov guards only on the
  # preceding character, and historica's log is the case that shows why:
  #
  #     … so `show <rev> <path>` prints the file rather than a document
  #
  # is correctly written, the character before `<` is a space, and the guard
  # lets the rule fire *inside* the code span, producing nested backticks that
  # render as nothing anyone meant. So the match may only begin at a line start
  # and may not cross a backtick to reach the `<`. A line already using code
  # spans is left entirely alone, which is the right way round: this rule exists
  # for prose that forgot the backticks, and prose that remembered them needs no
  # help. The cost is that only the first bare tag on such a line is caught —
  # fix the second by writing it in backticks, which is what it wanted anyway.
  { pattern = '(?m)^(?P<pre>[^`\n]*?)<(?P<tag>[a-zA-Z/][^<>\s]*)>', replace = "${pre}`<${tag}>`" },
]

# First match wins, so the `!` breaking rule has to precede the type rules.
# historica spells additions `add(scope):` rather than `feat(scope):`; both are
# accepted so any muscle memory lands in the same bucket, and `polish` rides
# with `refactor` for the same reason.
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^chore: (release|bump)', skip = true },
  { message = '^[a-zA-Z]+(\(.+\))?!:', group = "<0>Breaking" },
  { message = '^(add|feat)', group = "<1>Added" },
  { message = '^fix', group = "<2>Fixed" },
  { message = '^(refactor|perf|polish)', group = "<3>Changed" },
  { message = '^docs', skip = true },
  { message = '^(chore|test|ci|build|style)', skip = true },
  # A merge git wrote itself, and nothing else. The looser `^[Mm]erge` prov uses
  # would swallow `Merge two lines of work, and record the resolution`, which is
  # a commit that did the work rather than a commit that recorded a branch.
  { message = '^legacy: Merge (branch|pull request|remote-tracking)', skip = true },
  # `legacy:` is the type the preprocessor above gives the pre-convention
  # commits, which is to say: everything before the org convention arrived. Same
  # bucket as anything else off-convention — visible, and triaged by hand into
  # its real groups before the tag that first covers it is cut.
  { message = '^legacy', group = "<9>Uncategorised — triage before release" },
  # Anything left is off-convention too. It gets a visible bucket rather than a
  # silent drop, so the author decides where it belongs.
  { message = '.*', group = "<9>Uncategorised — triage before release" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
