[package]
name = "historica-remark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reader's remarks on a Historica chain, and the layer that carries them back"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/historica-remark"
# What a person searching crates.io would type. They arrive holding somebody
# else's history and wanting to write in the margin of it, so `historica` and
# `version-control` are the shelf; `annotation` is the model (the W3C Web
# Annotation Data Model, flattened); `comments` is the word they will try first.
keywords = ["historica", "annotation", "comments", "version-control", "markup"]
categories = ["development-tools", "text-processing"]

# A workspace of one package, kept for `[workspace.package]` below. CI is not a
# crate here: it is the jobs in .config/ship.figl, run by `ship ci`.
[workspace]

# One `version = "…"` line for the whole repository, which is what `ship bump`
# rewrites and what the package inherits.
[workspace.package]
version = "0.5.0"
edition = "2024"
# Minimum supported Rust version, enforced by the `msrv` CI job, which reads
# this value. It cannot go below historica's own floor.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/historica-remark"

# One split, and it is the one historica-minisign draws for the same reason:
# the half that only reads has to be cheap to depend on.
#
# `layer` is the transport — receiving somebody's chain, keeping it beside your
# own, carrying it onward. A caller that only wants the annotation model (a
# renderer, a viewer, an importer) takes `default-features = false` and gets
# `fig` and nothing else: no historica, no filesystem, no store.
[features]
default = ["layer"]
# Keeping a chain beside your own and carrying it onward. Everything that
# touches a store or a filesystem is behind this.
#
# It takes historica's `disk`, unlike historica-minisign's own `layer`-shaped
# split, because a kept layer *is* a directory: `keep`, `list` and `suppress`
# are named by their paths, and a caller that wanted to hold one somewhere
# other than a filesystem would be asking for a different thing. The one place
# this crate does not use `disk` is the export, which is written into memory on
# purpose — see `carry`.
layer = ["dep:historica", "historica/disk"]

[dependencies]
# The metadata a remark is written in. A remark's `exact`, `prefix` and
# `suffix` are verbatim slices of somebody else's prose — their edge
# whitespace is load-bearing and they may contain newlines — so the format
# carrying them has to quote, and fig's quoted scalars are that rule already
# written. Taken over inventing a `remark-0` line grammar for the same reason
# this crate does not invent a digest.
#
# The format features are the ones a caller is likely to meet in the wild: a
# store whose documents are YAML frontmatter, JSON, or TOML. `fig-lang` is
# deliberately absent — it adds a backend, and nothing here needs the authoring
# dialect to read a `target:` line.
fig = { version = "5", default-features = false, features = ["yaml", "json", "toml"] }
# The chains this is about. A version and no path, as everywhere in this org:
# what this crate can reach is what historica published.
#
# What is taken from it is the store, the filesystem seam, and the tree at a
# revision. Nothing here writes a historica document — a remark is content, and
# content is the caller's — which is why `layer` can be turned off at all.
historica = { version = "1.0.0-rc.2", optional = true }


[dev-dependencies]
# The claims and trust directories' spellings, for the test that pins which of
# them travels. Nothing in the library names either: historica carries a
# reserved directory by its class, so the tool that writes claims is a
# dependency of the *test* and not of the crate.
historica-minisign = { version = "0.1.0", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
