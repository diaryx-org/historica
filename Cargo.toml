[package]
name = "historica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A readable, convergent version-control experiment"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/historica"
# What a person searching crates.io would type. `version-control` and `vcs` are
# the two spellings of the same search; `crdt` and `merge` are what makes this
# one different from the rest of that shelf, since decision 0007 is why it
# converges; `readable` is the claim the whole format exists to make.
keywords = ["version-control", "vcs", "crdt", "merge", "readable"]
# `command-line-utilities` belonged here while this package carried the binary;
# it moved to `historica-cli` with it. What is left is what a caller linking the
# library is looking for.
categories = ["development-tools", "filesystem"]

# docs.rs is where `documentation` above points, so what it builds is the
# documentation. `all-features` because a feature-gated item is documented only
# in a build that has it.
#
# Deliberately no `rustdoc-args = ["--cfg", "docsrs"]`. The `doc_auto_cfg`
# feature that pairs with it was removed in Rust 1.92 and merged into `doc_cfg`,
# so the usual incantation now fails the build rather than labelling anything —
# and a docs.rs build that fails is worse than one whose gated items carry no
# badge. Revisit when `doc_cfg` is stable and can be named without a nightly.
[package.metadata.docs.rs]
all-features = true

# `cli` is the command-line front end, and `xtask` is historica's CI as a
# program: `cargo xtask <job>` runs one CI job and the workflow runs nothing
# else. Both are members so `cargo test --workspace` checks them; `xtask` also
# carries `publish = false`, which keeps it off crates.io.
[workspace]
members = ["cli", "xtask"]

# The version lives here rather than in `[package]` above so that one line is
# the whole answer to "what does this repository call itself" — `cargo xtask
# bump` rewrites exactly that line, and the package inherits it.
[workspace.package]
version = "1.0.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 needs 1.85; the crate also uses
# `if let … && let …` let-chains in stable positions, stabilized in 1.88 — so
# 1.88 is the true floor, enforced by the `msrv` CI job (which reads this value).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/historica"

# The library reaches the folder through `historica::fs::Filesystem`, never
# through `std::fs`. `disk` adds the implementation that is `std::fs`, and it is
# what every short constructor — `Store::open`, `Working::read` — resolves to.
# Turning it off leaves a library that compiles where `std::fs` does not work,
# and asks the host for the folder.
#
# It is the only feature here, and that is the whole of what this package asks a
# caller to choose between. Decision 0057's transport was the second one until
# 1.0, spelled `http` and on by default, even though no line of the library ever
# read it: it gated the command-line front end alone. A library consumer who did
# not think to write `default-features = false` linked a platform HTTP stack in
# order to compile code they had no way to call. The transport now lives in the
# `historica-cli` package beside the commands it was always for.
[features]
default = ["disk"]
disk = ["dep:fs-transaction"]

[dependencies]
# The write-safety layer under `Disk`, and nothing above it: decision 0026's
# atomic replacement, the store's exclusive create, and the barrier-then-drain
# ordering that keeps a record from surviving a crash the bytes it names did
# not. `barrier-fsync` answers ordering barriers with `F_BARRIERFSYNC` on
# Apple platforms instead of a drain of the drive's whole write cache, and is
# inert everywhere else.
fs-transaction = { version = "0.2", optional = true, features = ["barrier-fsync"] }
getrandom = "0.4"
jiff = "0.2"
sha2 = "0.11.0"
similar = "3.2"
unicode-normalization = "0.1.25"
