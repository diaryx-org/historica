[package]
name = "historica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A readable, convergent version-control experiment"
license.workspace = true
repository.workspace = true

# `xtask` is historica's CI, as a program: `cargo xtask <job>` runs one CI job
# and the workflow runs nothing else. It is a member so `cargo test --workspace`
# checks it, and `publish = false` keeps it off crates.io.
[workspace]
members = ["xtask"]

# The version lives here rather than in `[package]` above so that one line is
# the whole answer to "what does this repository call itself" — `cargo xtask
# bump` rewrites exactly that line, and the package inherits it.
[workspace.package]
version = "1.0.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 needs 1.85; the crate also uses
# `if let … && let …` let-chains in stable positions, stabilized in 1.88 — so
# 1.88 is the true floor, enforced by the `msrv` CI job (which reads this value).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/historica"

# The library reaches the folder through `historica::fs::Filesystem`, never
# through `std::fs`. `disk` adds the implementation that is `std::fs`, which is
# what the `historica` binary is built on and what every short constructor —
# `Store::open`, `Working::read` — resolves to. Turning it off leaves a library
# that compiles where `std::fs` does not work, and asks the host for the folder.
[features]
default = ["disk"]
disk = ["dep:atomic-write-file"]

# The command-line front end is `std::fs` throughout, deliberately: decision
# 0025 puts the seam at the library's edge, and a CLI is the one caller that
# always knows it is talking to a real filesystem.
[[bin]]
name = "historica"
path = "src/main.rs"
required-features = ["disk"]

[dependencies]
atomic-write-file = { version = "0.2.3", optional = true }
getrandom = "0.4"
jiff = "0.2"
sha2 = "0.11.0"
similar = "3.2"
unicode-normalization = "0.1.25"
