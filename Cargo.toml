[package]
name = "historica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A readable, convergent version-control experiment"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/historica"
# What a person searching crates.io would type. `version-control` and `vcs` are
# the two spellings of the same search; `crdt` and `merge` are what makes this
# one different from the rest of that shelf, since decision 0007 is why it
# converges; `readable` is the claim the whole format exists to make.
keywords = ["version-control", "vcs", "crdt", "merge", "readable"]
categories = ["development-tools", "command-line-utilities", "filesystem"]

# `xtask` is historica's CI, as a program: `cargo xtask <job>` runs one CI job
# and the workflow runs nothing else. It is a member so `cargo test --workspace`
# checks it, and `publish = false` keeps it off crates.io.
[workspace]
members = ["xtask"]

# The version lives here rather than in `[package]` above so that one line is
# the whole answer to "what does this repository call itself" — `cargo xtask
# bump` rewrites exactly that line, and the package inherits it.
[workspace.package]
version = "1.0.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 needs 1.85; the crate also uses
# `if let … && let …` let-chains in stable positions, stabilized in 1.88 — so
# 1.88 is the true floor, enforced by the `msrv` CI job (which reads this value).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/historica"

# The library reaches the folder through `historica::fs::Filesystem`, never
# through `std::fs`. `disk` adds the implementation that is `std::fs`, which is
# what the `historica` binary is built on and what every short constructor —
# `Store::open`, `Working::read` — resolves to. Turning it off leaves a library
# that compiles where `std::fs` does not work, and asks the host for the folder.
#
# `http` is the same shape one seam further out (decision 0057). The library's
# fetch takes a `Source` that answers `get(path)`; this feature is the binary's
# implementation of it, and nothing in `src/` outside `src/cli/fetch.rs` knows
# it exists. On by default so that `cargo install historica` fetches out of the
# box, and off in one flag so the CLI still builds for a target with no such
# stack under it — wasm32-wasip1 and wasip2, where a host brings its own
# transport through the trait instead.
[features]
default = ["disk", "http"]
disk = ["dep:fs-transaction"]
http = ["dep:nyquest", "dep:nyquest-preset"]

# The command-line front end is `std::fs` throughout, deliberately: decision
# 0025 puts the seam at the library's edge, and a CLI is the one caller that
# always knows it is talking to a real filesystem.
[[bin]]
name = "historica"
path = "src/main.rs"
required-features = ["disk"]

[dependencies]
# The write-safety layer under `Disk`, and nothing above it: decision 0026's
# atomic replacement, the store's exclusive create, and the barrier-then-drain
# ordering that keeps a record from surviving a crash the bytes it names did
# not. `barrier-fsync` answers ordering barriers with `F_BARRIERFSYNC` on
# Apple platforms instead of a drain of the drive's whole write cache, and is
# inert everywhere else.
fs-transaction = { version = "0.2", optional = true, features = ["barrier-fsync"] }
getrandom = "0.4"
# The platform's own HTTP stack, behind one interface: WinRT on Windows,
# NSURLSession on Apple, libcurl elsewhere. Decision 0057 argues the choice —
# what a fetch rides on is the TLS root store, the proxy configuration and the
# security update cadence the machine already has, rather than a second copy of
# all three vendored into this binary. `blocking` because the CLI is
# synchronous from `main` down and an executor would be the largest dependency
# in the tree by far.
#
# Pinned exactly, which is unusual here and deliberate: nyquest is early and
# says its API is subject to change, so a patch release is a thing to read
# before taking rather than to receive. `cargo update` will not move it and
# `cargo xtask bump` does not touch it; moving it is somebody typing the
# version.
nyquest = { version = "=0.4.0", optional = true, features = ["blocking"] }
nyquest-preset = { version = "=0.4.0", optional = true, features = ["blocking"] }
jiff = "0.2"
sha2 = "0.11.0"
similar = "3.2"
unicode-normalization = "0.1.25"
