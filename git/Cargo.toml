[package]
name = "historica-git"
# Its own version rather than the workspace's, which is historica's: each
# crate in this repository is released on its own.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Conversion between git repositories and Historica stores"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/historica-git"
# What a person searching crates.io would type. They arrive holding a git
# repository and wanting it somewhere else, or holding a store and wanting it
# where their colleagues are, so `git` and `version-control` are the shelf and
# `convert`, `import`, `export` are the errand.
keywords = ["git", "version-control", "convert", "import", "export"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# The library beside it, by path, and by version for publishing: `cargo
# publish` drops the path and uploads the version as the requirement. Decision
# 0001's boundary still holds, because it never rested on the registry: a
# `pub(crate)` in historica is unreachable from another crate whichever way it
# is found, and a fact the API does not expose is a change to historica rather
# than a hole opened on this side.
#
# What the path changes is when a change arrives. Here, one in the library is
# built against on the commit that makes it, and CI runs this crate's tests on
# that commit too. The version is written in full for the reason
# `cli/Cargo.toml` gives: a caret requirement does not match a pre-release.
historica = { version = "1.0.0-rc.8", path = ".." }
# Decision 0003 derives a file identifier as `SHA-256` of the commit's object ID
# and a counter, so that a conversion re-run produces the store it produced
# before. It is the hash historica already uses, and the derivation is one a
# person can check with the `shasum` they already have.
jiff = "0.2"
sha2 = "0.11.0"
